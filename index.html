<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOTCATPICS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sometype+Mono:wght@400;600&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=29" />
  <style>
    .preset-placed-sticker,
    .detail-placed-sticker {
      object-fit: contain !important;
    }
    *, html, body {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar,
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }
    html, body {
      overflow-x: hidden !important;
    }
    .preset-sticker-surface,
    .detail-sticker-surface {
      -webkit-mask-image: none !important;
      mask-image: none !important;
      overflow: visible !important;
      opacity: 1 !important;
      visibility: visible !important;
      z-index: 20 !important;
    }
  </style>
  <link rel="stylesheet" href="responsive.css?v=12" />
  <script src="responsive.js?v=4"></script>
</head>
<body>
  <div class="landing-page" id="landingPage">
    <!-- Top Navigation / Header -->
    <header class="header">
      <a href="index.html" class="logo" id="logoLink">HOTCATPICS</a>

      <nav class="main-nav">
        <a href="index.html" class="nav-item nav-presets active" id="presetsNavLink">PRESETS</a>
        <a href="inventory.html" class="nav-item nav-inventory">INVENTORY</a>
        <a href="index.html#profile" class="nav-item nav-profile" id="profileNavLink">PROFILE</a>
      </nav>

      <div class="header-right">
        <a href="#" class="nav-item nav-wishlist" id="navWishlist">LIKED 0</a>
      </div>
    </header>

    <!-- Sub-Navigation / Sort Filter Toggle (hidden when a preset is opened in split view) -->
    <div class="filter-bar is-collapsed" id="filterBar">
      <button class="close-btn" id="clearPresetsBtn" aria-label="Toggle filter">
        <span class="close-line line-1"></span>
        <span class="close-line line-2"></span>
      </button>
      <button type="button" class="filter-trigger-label" id="filterTriggerLabel">Filter</button>
      <div class="filter-categories" id="sortFilterGroup">
        <a href="#" class="filter-item active" data-sort="popular">Most Liked</a>
        <a href="#" class="filter-item" data-sort="price-desc">Highest to Lowest</a>
        <a href="#" class="filter-item" data-sort="price-asc">Lowest to Highest</a>
      </div>
    </div>

    <!-- Scrollable Blocks Grid (4 columns default -> 2 columns on left when a preset is opened) -->
    <main class="grid-container" id="presetsGrid"></main>

    <!-- Right-Side Expanded Preset View (Shown when a preset block is clicked) -->
    <button type="button" class="mobile-back-btn" id="mobileBackBtn">‹ BACK TO PRESETS</button>
    <aside class="preset-detail-panel" id="presetDetailPanel">
      <div class="detail-preview-box" id="detailPreviewBox">
        <button type="button" class="preset-like-btn detail-like-btn" id="detailLikeBtn" aria-label="Add to wishlist"></button>
        <div class="detail-case-stage" id="detailCaseStage">
          <img src="assets/case-white.png" alt="Preset Case" class="detail-case-img" id="detailCaseImg" />
          <div class="detail-sticker-surface" id="detailStickerSurface"></div>
        </div>
      </div>

      <!-- Accumulated PRICE Row (excludes delivery charges) -->
      <div class="detail-price-row">
        <span class="detail-price-label">PRICE</span>
        <span class="detail-price-leader"></span>
        <span class="detail-price-value" id="detailPriceValue">₹0</span>
      </div>

      <!-- Action Button: BUY -->
      <div class="detail-actions">
        <button type="button" class="detail-btn btn-buy-now" id="detailBuyBtn">BUY</button>
      </div>
    </aside>
    <footer class="site-footer"><a href="https://www.instagram.com/hotcatpic/" target="_blank" rel="noopener noreferrer">instagram - @hotcatpic</a><span class="footer-sep">|</span><a href="privacy.html">privacy policy</a></footer>
  </div>

  <script>
    const CASE_IMAGE_MAP = {
      red: 'assets/case-red.png',
      white: 'assets/case-white.png',
      blue: 'assets/case-blue.png',
      black: 'assets/case-black.png'
    };

    const CASE_COLOR_CODES = {
      red: 'P_Cover1',
      white: 'P_Cover2',
      blue: 'P_Cover3',
      black: 'P_Cover4'
    };

    const CANONICAL_STICKER_DIMS = {
      s1: { width: 152, height: 152 },
      s2: { width: 143, height: 255 },
      s3: { width: 143, height: 104 },
      s4: { width: 170, height: 126 },
      s5: { width: 152, height: 143 },
      s6: { width: 174, height: 129 }
    };

    const STICKER_PRICE_MAP = {
      s1: 149.00,
      s2: 119.00,
      s3: 99.00,
      s4: 129.00,
      s5: 89.00,
      s6: 139.00
    };

    const STICKER_PRICE_BY_NAME = {
      'S_SpiderGuitar': 149.00,
      'S_SpiderPunk': 119.00,
      'S_SpiderIDCard': 99.00,
      'S_HobieIDCard': 129.00,
      'S_HobieNote': 89.00,
      'S_PunkLogo': 139.00
    };

    const landingPage = document.getElementById('landingPage');
    const presetsNavLink = document.getElementById('presetsNavLink');
    const profileNavLink = document.getElementById('profileNavLink');
    const navWishlist = document.getElementById('navWishlist');
    const clearPresetsBtn = document.getElementById('clearPresetsBtn');
    const detailPreviewBox = document.getElementById('detailPreviewBox');
    const detailLikeBtn = document.getElementById('detailLikeBtn');
    const detailCaseImg = document.getElementById('detailCaseImg');
    const detailStickerSurface = document.getElementById('detailStickerSurface');
    const detailPriceValue = document.getElementById('detailPriceValue');
    const detailBuyBtn = document.getElementById('detailBuyBtn');

    // Clean up legacy v1 test presets
    try {
      localStorage.removeItem('hotcatpics_presets');
      if (window.name && window.name.startsWith('{')) {
        const legacy = JSON.parse(window.name);
        if (legacy && legacy.presets && !legacy.v2) {
          delete legacy.presets;
          legacy.v2 = true;
          window.name = JSON.stringify(legacy);
        }
      }
    } catch (e) {}

    function getUserId() {
      let uid = null;
      try {
        uid = localStorage.getItem('hotcatpics_user_id');
        if (!uid) {
          uid = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
          localStorage.setItem('hotcatpics_user_id', uid);
        }
      } catch (e) {}
      return uid || 'local_user';
    }

    function loadStore() {
      let store = { v2: true };
      try {
        if (window.name && window.name.startsWith('{')) {
          store = { ...store, ...JSON.parse(window.name) };
        }
      } catch (e) {}
      try {
        const lsPresets = localStorage.getItem('hotcatpics_presets_v2');
        if (lsPresets) {
          store.presets = JSON.parse(lsPresets);
        }
        const lsWish = localStorage.getItem('hotcatpics_wishlist');
        if (lsWish) {
          store.wishlist = JSON.parse(lsWish);
        }
        const lsMine = localStorage.getItem('hotcatpics_my_presets_v2');
        if (lsMine) {
          store.myPresetsV2 = JSON.parse(lsMine);
        }
      } catch (e) {}
      return store;
    }

    function saveStore(updates) {
      const store = { ...loadStore(), ...updates, v2: true };
      try {
        window.name = JSON.stringify(store);
      } catch (e) {}
      try {
        if (store.presets !== undefined) {
          localStorage.setItem('hotcatpics_presets_v2', JSON.stringify(store.presets));
        }
        if (store.wishlist !== undefined) {
          localStorage.setItem('hotcatpics_wishlist', JSON.stringify(store.wishlist));
        }
        if (store.myPresetsV2 !== undefined) {
          localStorage.setItem('hotcatpics_my_presets_v2', JSON.stringify(store.myPresetsV2));
        }
        if (store.currentOrder !== undefined) {
          localStorage.setItem('hotcatpics_current_order', JSON.stringify(store.currentOrder));
        }
      } catch (e) {}
    }

    const HEART_SVG = '<svg width="16" height="15" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2C12 20.2 2.5 14 2.5 7.2C2.5 3.9 5.1 1.5 8.2 1.5C10.1 1.5 11.4 2.5 12 3.8C12.6 2.5 13.9 1.5 15.8 1.5C18.9 1.5 21.5 3.9 21.5 7.2C21.5 14 12 20.2 12 20.2Z"/></svg>';

    let wishlistOnlyMode = location.hash === '#wishlist';
    let profileOnlyMode = location.hash === '#profile';
    let currentSortMode = 'popular';
    const sortFilterLinks = document.querySelectorAll('[data-sort]');
    const filterBar = document.getElementById('filterBar');
    const filterTriggerLabel = document.getElementById('filterTriggerLabel');

    function getPresetKey(preset, fallbackIdx) {
      if (preset && preset.id) return String(preset.id);
      return `preset_idx_${fallbackIdx || 0}`;
    }

    function getWishlistSet() {
      const list = loadStore().wishlist;
      return new Set(Array.isArray(list) ? list : []);
    }

    function getMyPresetsSet() {
      const list = loadStore().myPresetsV2;
      return new Set(Array.isArray(list) ? list : []);
    }

    function isMyPreset(preset, fallbackIdx) {
      const key = getPresetKey(preset, fallbackIdx);
      if (getMyPresetsSet().has(key)) return true;
      if (preset && preset.ownerId && preset.ownerId === getUserId()) return true;
      return false;
    }

    function syncWishlistHeader() {
      const presets = Array.isArray(loadStore().presets) ? loadStore().presets : [];
      const validKeys = new Set(presets.map((p, i) => getPresetKey(p, i)));
      const wishSet = getWishlistSet();
      // Keep only wishlist entries that correspond to existing presets (if presets are loaded)
      let count = 0;
      if (presets.length > 0) {
        wishSet.forEach((k) => { if (validKeys.has(k)) count += 1; });
      } else {
        count = wishSet.size;
      }
      navWishlist.textContent = `LIKED ${count}`;
      navWishlist.classList.toggle('active', wishlistOnlyMode);
      landingPage.classList.toggle('liked-view', wishlistOnlyMode);
      landingPage.classList.toggle('profile-view', profileOnlyMode);
      if (profileNavLink) profileNavLink.classList.toggle('active', profileOnlyMode);
      presetsNavLink.classList.toggle('active', !wishlistOnlyMode && !profileOnlyMode);
    }

    // Snapshot of popularity scores taken on page load so liking a preset never jumps its position in front of the user;
    // the new position takes effect when the user refreshes the page.
    const sessionPopularitySnapshot = new Map();

    function getSessionPopularity(preset, idx, wishSet) {
      const key = getPresetKey(preset, idx);
      if (!sessionPopularitySnapshot.has(key)) {
        const w = Math.max(Number(preset.wishlists) || 0, wishSet.has(key) ? 1 : 0);
        sessionPopularitySnapshot.set(key, w);
      }
      return sessionPopularitySnapshot.get(key);
    }

    function toggleWishlistForPreset(preset, fallbackIdx) {
      const key = getPresetKey(preset, fallbackIdx);
      const wishSet = getWishlistSet();
      // Ensure snapshot is recorded BEFORE mutating so current session order stays stable until refresh
      getSessionPopularity(preset, fallbackIdx, wishSet);

      let delta = 1;
      if (wishSet.has(key)) {
        wishSet.delete(key);
        delta = -1;
      } else {
        wishSet.add(key);
        delta = 1;
      }

      const store = loadStore();
      const list = Array.isArray(store.presets) ? store.presets : [];
      const hit = list.find((p, i) => getPresetKey(p, i) === key);
      if (hit) {
        hit.wishlists = Math.max(0, (Number(hit.wishlists) || 0) + delta);
      }

      saveStore({ wishlist: Array.from(wishSet), presets: list });
      syncWishlistHeader();

      const nowLiked = wishSet.has(key);
      if (activePresetData && getPresetKey(activePresetData, activePresetIndex) === key) {
        detailLikeBtn.classList.toggle('is-liked', nowLiked);
      }
      // Update the heart button in place without re-sorting or jumping cards in front of the user
      document.querySelectorAll('.preset-like-btn[data-preset-key]').forEach((btn) => {
        if (btn.dataset.presetKey === key) {
          btn.classList.toggle('is-liked', nowLiked);
        }
      });

      if (preset && preset.id) {
        fetch('https://ntfy.sh/hotcatpics_cloud_v2_9380ba82', {
          method: 'POST',
          body: JSON.stringify({ action: 'wishlist', id: preset.id, delta })
        }).catch(() => {});
      }
    }

    detailLikeBtn.innerHTML = HEART_SVG;
    detailLikeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!activePresetData) return;
      toggleWishlistForPreset(activePresetData, activePresetIndex);
    });

    const BLOCK_COLORS = ['#8783FF', '#F8D548', '#61C7E7', '#7B0000', '#C8C8C8', '#FF9393', '#2AB8E6', '#FDE7AC'];

    // Count an order against the active preset (drives tie-break ranking)
    function bumpOrders(preset) {
      const store = loadStore();
      const list = Array.isArray(store.presets) ? store.presets : [];
      const hit = list.find((p) => p.id && p.id === preset.id);
      if (hit) {
        hit.orders = (hit.orders || 0) + 1;
        saveStore({ presets: list });
      }
      if (preset && preset.id) {
        fetch('https://ntfy.sh/hotcatpics_cloud_v2_9380ba82', {
          method: 'POST',
          body: JSON.stringify({ action: 'order', id: preset.id })
        }).catch(() => {});
      }
    }

    let activePresetIndex = null;
    let activePresetData = null;

    // Calculate accumulated price of all products in a preset (case + stickers, excluding delivery)
    function calculatePresetPrice(preset) {
      let total = 500.00; // Phone case base price
      if (Array.isArray(preset.stickers)) {
        preset.stickers.forEach((s) => {
          const p = (s.id && STICKER_PRICE_MAP[s.id]) ||
                    (s.name && STICKER_PRICE_BY_NAME[s.name]) ||
                    (Number(s.price) >= 80 && Number(s.price) <= 150 ? Number(s.price) : 119.00);
          total += p;
        });
      }
      return total;
    }

    function populateDetailStageContent(preset, blockEl, idx) {
      // Use the preset's background color or the block's background color
      const blockBg = preset.bgColor || blockEl.style.backgroundColor || '#5DC6E8';
      detailPreviewBox.style.backgroundColor = blockBg;

      const caseSrc = CASE_IMAGE_MAP[preset.caseColor] || CASE_IMAGE_MAP.white;
      detailCaseImg.src = caseSrc;

      detailStickerSurface.innerHTML = '';
      if (Array.isArray(preset.stickers)) {
        preset.stickers.forEach((sticker) => {
          const dims = (sticker.id && CANONICAL_STICKER_DIMS[sticker.id]) || sticker;
          const sImg = document.createElement('img');
          sImg.src = sticker.src.replace(/^\.\.\//, '');
          sImg.alt = sticker.name || 'Sticker';
          sImg.className = 'detail-placed-sticker';
          sImg.draggable = false;
          sImg.style.left = `${sticker.left}px`;
          sImg.style.top = `${sticker.top}px`;
          sImg.style.width = `${dims.width}px`;
          sImg.style.height = `${dims.height}px`;
          sImg.style.zIndex = String(sticker.zIndex || 22);
          if (sticker.rotate) {
            sImg.style.transform = `rotate(${sticker.rotate}deg)`;
          }
          detailStickerSurface.appendChild(sImg);
        });
      }

      const accumulatedPrice = calculatePresetPrice(preset);
      detailPriceValue.textContent = `₹${Math.round(accumulatedPrice)}`;

      const isLiked = getWishlistSet().has(getPresetKey(preset, idx));
      detailLikeBtn.classList.toggle('is-liked', isLiked);
    }

    let openDetailTimer = null;

    // Open a preset in the right-hand split view with a tiny bit of calm latency (not instant)
    function openPresetDetail(preset, blockEl, idx) {
      activePresetIndex = idx;
      activePresetData = preset;

      document.querySelectorAll('.block').forEach((b) => b.classList.remove('active-preset'));
      blockEl.classList.add('active-preset');

      if (openDetailTimer) clearTimeout(openDetailTimer);

      // Brief 120ms deliberate load latency instead of an abrasive instant snap
      openDetailTimer = setTimeout(() => {
        populateDetailStageContent(preset, blockEl, idx);
        landingPage.classList.add('split-view');
        if (window.innerWidth <= 820) window.scrollTo({ top: 0, behavior: 'smooth' });
        updateCanvasHeight();
      }, 120);
    }

    function closePresetDetail() {
      if (openDetailTimer) clearTimeout(openDetailTimer);
      activePresetIndex = null;
      activePresetData = null;
      document.querySelectorAll('.block').forEach((b) => b.classList.remove('active-preset'));
      landingPage.classList.remove('split-view');
      updateCanvasHeight();
    }

    // Clicking PRESETS nav link returns to full 4-column grid and exits wishlist/profile filter
    presetsNavLink.addEventListener('click', (e) => {
      if (landingPage.classList.contains('split-view') || wishlistOnlyMode || profileOnlyMode) {
        e.preventDefault();
        wishlistOnlyMode = false;
        profileOnlyMode = false;
        if (location.hash) history.replaceState(null, '', 'index.html');
        closePresetDetail();
        syncWishlistHeader();
        renderSharedPresets();
      }
    });

    // Clicking PROFILE in top nav shows presets shared by this user
    if (profileNavLink) {
      profileNavLink.addEventListener('click', (e) => {
        e.preventDefault();
        profileOnlyMode = true;
        wishlistOnlyMode = false;
        history.replaceState(null, '', '#profile');
        closePresetDetail();
        syncWishlistHeader();
        renderSharedPresets();
      });
    }

    // Clicking WISHLIST in top-right filters the grid to wishlisted presets (or back to all)
    navWishlist.addEventListener('click', (e) => {
      e.preventDefault();
      wishlistOnlyMode = !wishlistOnlyMode;
      profileOnlyMode = false;
      history.replaceState(null, '', wishlistOnlyMode ? '#wishlist' : 'index.html');
      closePresetDetail();
      syncWishlistHeader();
      renderSharedPresets();
    });

    document.getElementById('mobileBackBtn').addEventListener('click', closePresetDetail);

    sortFilterLinks.forEach((link) => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        currentSortMode = link.dataset.sort || 'popular';
        sortFilterLinks.forEach((l) => l.classList.toggle('active', l === link));
        closePresetDetail();
        renderSharedPresets();
      });
    });

    if (filterTriggerLabel) {
      filterTriggerLabel.addEventListener('click', () => {
        filterBar.classList.remove('is-collapsed');
      });
    }

    if (clearPresetsBtn) {
      clearPresetsBtn.addEventListener('click', () => {
        filterBar.classList.toggle('is-collapsed');
      });
    }

    // BUY button in detail view -> passes all products of this preset to checkout.html
    detailBuyBtn.addEventListener('click', () => {
      if (!activePresetData) return;

      const modelName = activePresetData.model === 'IPHONE 16' ? 'IPhone 16' : (activePresetData.model || 'IPhone 16');
      const coverCode = CASE_COLOR_CODES[activePresetData.caseColor] || 'P_Cover2';

      const currentOrder = {
        presetId: activePresetData.id || null,
        model: activePresetData.model || 'IPHONE 16',
        caseColor: activePresetData.caseColor || 'white',
        bgColor: activePresetData.bgColor || '#5DC6E8',
        includeCase: true,
        caseLabel: `${modelName}: ${coverCode}`,
        casePrice: 500.00,
        stickers: Array.isArray(activePresetData.stickers) ? activePresetData.stickers.map((s) => {
          const p = (s.id && STICKER_PRICE_MAP[s.id]) ||
                    (s.name && STICKER_PRICE_BY_NAME[s.name]) ||
                    (Number(s.price) >= 80 && Number(s.price) <= 150 ? Number(s.price) : 119.00);
          return { ...s, price: p };
        }) : []
      };

      saveStore({ currentOrder });
      bumpOrders(activePresetData);
      window.location.href = 'checkout.html';
    });

    // Keep empty space above the footer: canvas grows with the content
    function updateCanvasHeight() {
      const grid = document.getElementById('presetsGrid');
      const detailPanel = document.getElementById('presetDetailPanel');
      let bottom = grid.offsetTop + grid.offsetHeight;
      if (landingPage.classList.contains('split-view')) {
        bottom = Math.max(bottom, detailPanel.offsetTop + detailPanel.offsetHeight);
      }
      landingPage.style.minHeight = `${Math.max(900, bottom + 160)}px`;
    }

    function renderSharedPresets() {
      const grid = document.getElementById('presetsGrid');
      const currentStore = loadStore();
      const presets = Array.isArray(currentStore.presets) ? currentStore.presets : [];
      grid.innerHTML = '';

      const wishSet = getWishlistSet();

      // Sort presets according to active filter toggle (Most Liked / Highest to Lowest / Lowest to Highest)
      const sorted = presets
        .map((p, i) => ({
          p,
          i,
          w: getSessionPopularity(p, i, wishSet),
          price: calculatePresetPrice(p)
        }))
        .sort((a, b) => {
          if (currentSortMode === 'price-desc') {
            return (b.price - a.price) || (b.w - a.w) || (b.i - a.i);
          }
          if (currentSortMode === 'price-asc') {
            return (a.price - b.price) || (b.w - a.w) || (b.i - a.i);
          }
          return (b.w - a.w) || ((b.p.orders || 0) - (a.p.orders || 0)) || (b.i - a.i);
        })
        .map((x) => x.p)
        .filter((p, i) => {
          if (wishlistOnlyMode) return wishSet.has(getPresetKey(p, i));
          if (profileOnlyMode) return isMyPreset(p, i);
          return true;
        });

      sorted.forEach((preset, idx) => {
        const block = document.createElement('div');
        block.className = 'block has-preset';
        block.style.backgroundColor = preset.bgColor || BLOCK_COLORS[idx % BLOCK_COLORS.length];
        grid.appendChild(block);

        const presetStage = document.createElement('div');
        presetStage.className = 'preset-case-stage';

        const caseImg = document.createElement('img');
        caseImg.src = CASE_IMAGE_MAP[preset.caseColor] || CASE_IMAGE_MAP.white;
        caseImg.alt = preset.model || 'iPhone 16 Case';
        caseImg.className = 'preset-case-img';
        caseImg.draggable = false;
        presetStage.appendChild(caseImg);

        const stickerSurface = document.createElement('div');
        stickerSurface.className = 'preset-sticker-surface';
        if (Array.isArray(preset.stickers)) {
          preset.stickers.forEach((sticker) => {
            const dims = (sticker.id && CANONICAL_STICKER_DIMS[sticker.id]) || sticker;
            const sImg = document.createElement('img');
            sImg.src = sticker.src.replace(/^\.\.\//, '');
            sImg.alt = sticker.name || 'Sticker';
            sImg.className = 'preset-placed-sticker';
            sImg.draggable = false;
            sImg.style.left = `${sticker.left}px`;
            sImg.style.top = `${sticker.top}px`;
            sImg.style.width = `${dims.width}px`;
            sImg.style.height = `${dims.height}px`;
            sImg.style.zIndex = String(sticker.zIndex || 22);
            if (sticker.rotate) {
              sImg.style.transform = `rotate(${sticker.rotate}deg)`;
            }
            stickerSurface.appendChild(sImg);
          });
        }
        presetStage.appendChild(stickerSurface);

        block.appendChild(presetStage);

        // Minimalistic heart button to like / add preset to wishlist
        const likeBtn = document.createElement('button');
        likeBtn.type = 'button';
        const presetKey = getPresetKey(preset, idx);
        const isLiked = wishSet.has(presetKey);
        likeBtn.className = 'preset-like-btn' + (isLiked ? ' is-liked' : '');
        likeBtn.dataset.presetKey = presetKey;
        likeBtn.setAttribute('aria-label', 'Like preset');
        likeBtn.innerHTML = HEART_SVG;
        likeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleWishlistForPreset(preset, idx);
        });
        block.appendChild(likeBtn);

        // Total accumulated price on the preset cover
        const priceTag = document.createElement('span');
        priceTag.className = 'preset-price-tag';
        priceTag.textContent = `₹${Math.round(calculatePresetPrice(preset))}`;
        block.appendChild(priceTag);

        // Clicking a populated preset block opens it in the split-view detail panel
        block.onclick = () => {
          if (activePresetIndex === idx && landingPage.classList.contains('split-view')) {
            closePresetDetail();
          } else {
            openPresetDetail(preset, block, idx);
          }
        };
      });
      syncWishlistHeader();
      updateCanvasHeight();
    }

    async function syncSharedPresetsFromServer() {
      const CLOUD_URL = 'https://ntfy.sh/hotcatpics_cloud_v2_9380ba82';
      try {
        const res = await fetch(`${CLOUD_URL}/json?poll=1&since=all`);
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);

        const byId = new Map();
        const localPresets = Array.isArray(loadStore().presets) ? loadStore().presets : [];
        const cloudPresetIds = new Set();

        for (const line of lines) {
          try {
            const env = JSON.parse(line);
            if (env.event !== 'message' || !env.message) continue;
            const payload = JSON.parse(env.message);
            if (payload.action === 'share' && payload.preset && payload.preset.id) {
              cloudPresetIds.add(payload.preset.id);
              if (!byId.has(payload.preset.id)) {
                byId.set(payload.preset.id, {
                  wishlists: 0,
                  orders: 0,
                  ...payload.preset
                });
              }
            } else if (payload.action === 'wishlist' && payload.id && byId.has(payload.id)) {
              const p = byId.get(payload.id);
              p.wishlists = Math.max(0, (Number(p.wishlists) || 0) + (Number(payload.delta) === -1 ? -1 : 1));
            } else if (payload.action === 'order' && payload.id && byId.has(payload.id)) {
              const p = byId.get(payload.id);
              p.orders = (Number(p.orders) || 0) + 1;
            }
          } catch (e) {}
        }

        // Push any locally-created presets not yet in the cloud stream
        for (const lp of localPresets) {
          if (lp && lp.id && !cloudPresetIds.has(lp.id)) {
            byId.set(lp.id, { wishlists: 0, orders: 0, ...lp });
            fetch(CLOUD_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'share', preset: lp })
            }).catch(() => {});
          }
        }

        saveStore({ presets: Array.from(byId.values()) });
        renderSharedPresets();
      } catch (e) {}
    }

    renderSharedPresets();
    syncSharedPresetsFromServer();

    // Real-time live subscription so new presets shared by friends appear immediately,
    // while wishlist clicks only reorder on page refresh
    try {
      const es = new EventSource('https://ntfy.sh/hotcatpics_cloud_v2_9380ba82/sse');
      es.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (data && data.action === 'wishlist') return;
        } catch (e) {}
        syncSharedPresetsFromServer();
      };
    } catch (e) {}
  </script>
</body>
